# TEMPORARY: hunts the Windows smoke-run heap corruption. Removed before merge.
name: Heap diag

on:
  push:
    branches: [claude/project-thread-p7mae4]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hunt:
    name: Hunt (skip ${{ matrix.skip }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        heap: [full]
        skip: [x, x2]
    steps:
      - uses: actions/checkout@v4
      - run: python .github/heap/variant.py ${{ matrix.skip }}
      - uses: ./.github/actions/rust
      - run: cargo build --release -p gc_game
      - name: Find the debugger
        shell: pwsh
        run: |
          $c = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $c) { Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10' -ErrorAction SilentlyContinue; throw 'no cdb' }
          "CDB=$($c.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "cdb at $($c.FullName)"
      - name: Turn on page heap for grubcraft.exe
        shell: pwsh
        run: |
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\grubcraft.exe'
          New-Item -Path $k -Force | Out-Null
          # hpa (page heap) + ust (allocation stack traces)
          New-ItemProperty -Path $k -Name GlobalFlag -Value 0x02001000 -PropertyType DWord -Force | Out-Null
          $flags = if ('${{ matrix.heap }}' -eq 'full') { 0x3 } else { 0x2 }
          New-ItemProperty -Path $k -Name PageHeapFlags -Value $flags -PropertyType DWord -Force | Out-Null
      - name: Run the battle under the debugger until it crashes
        shell: pwsh
        run: |
          $exe = (Resolve-Path target/release/grubcraft.exe).Path
          $dir = Split-Path $exe
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          $cmds = 'sxd av; sxd eh; sxd ch; g; .echo ===CRASH===; .lastevent; r; kv 40; q'
          $crashes = 0
          for ($i = 1; $i -le 8; $i++) {
            $app = Join-Path $env:RUNNER_TEMP "gc-$i"
            New-Item -ItemType Directory -Force -Path $app | Out-Null
            $env:GRUBCRAFT_SETTINGS = Join-Path $app 'settings.ron'
            $log = "diag/run-$i.txt"
            $start = Get-Date
            & $env:CDB -g -G -lines -y "srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols;$dir" -c $cmds $exe --frames 40 --no-audio --battle recruit --no-shadows --no-glow *> $log
            $secs = [int]((Get-Date) - $start).TotalSeconds
            $crashed = Select-String -Path $log -Pattern 'second chance|FAILURE_BUCKET_ID' -Quiet
            Write-Host "run $i : $secs s, crashed=$crashed"
            if ($crashed) { $crashes++; Select-String -Path $log -Pattern '===CRASH===' -Context 0,30 }
          }
          Write-Host "SUMMARY skip=${{ matrix.skip }} crashes=$crashes of 8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heap-diag-${{ matrix.skip }}
          path: diag/
          retention-days: 5
