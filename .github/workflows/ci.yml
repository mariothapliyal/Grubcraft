name: CI

on:
  # Docs-only PRs skip CI (a PR that also changes code still runs it).
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  # Pushes to main run this through latest.yml, and version tags through
  # release.yml, so it has no push trigger of its own: that ran every merge
  # twice. The free plan runs only 5 macOS jobs at a time, and each run of
  # this workflow takes 2, so doubled and outdated runs kept the release
  # build waiting for a Mac.
  workflow_call:

# A new push to a PR cancels that PR's older run. Runs called from
# latest.yml or release.yml get a group of their own and are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: Tracy profiling build
        run: cargo clippy -p gc_game --features profile
      - name: Data reload build (dev feature)
        run: cargo clippy -p gc_game --all-targets --features dev

  rules-numbers:
    # Each simulation pull request takes the next SIM_VERSION (and maybe
    # FORMAT or PROTOCOL). When another pull request took the same number
    # first, this says so in seconds instead of after the full run, with the
    # one command that catches up (replays/README.md).
    name: Rules numbers ahead of main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history for the merge base, but file contents only as read.
          fetch-depth: 0
          filter: blob:none
      - name: Compare with main as it is now
        env:
          BASE: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin "$BASE"
          python3 scripts/rules-bump.py --check "origin/$BASE" "$HEAD_SHA"

  packs:
    # The committed art and sound packs are binaries, so this fails when one
    # no longer matches the manifest beside it. The sound bank is re-made
    # from its recipes and compared byte for byte. The model pack cannot be
    # re-baked here (most sources live outside the repository), so its
    # manifest is compared with models.ron, the pack and the sources the repo
    # holds; the check says how many shared sources it could not look at.
    # Each faction's building pack is checked the same way.
    name: Packs match their manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - run: cargo run --release -p gc_artbake -- --check
      - run: cargo run --release -p gc_scenebake -- --check
      - name: Surface detail textures
        run: cargo run --release -p gc_artbake -- --detail --check
      - name: Building packs (one per faction)
        shell: bash
        run: |
          for config in assets-src/buildings/*.ron; do
            faction=$(basename "$config" .ron)
            cargo run --release -p gc_artbake -- --config "$config" --out "assets/buildings/$faction.pak" --check
          done
      - run: cargo run --release -p gc_sfx -- --check

  test:
    # The determinism tests must produce identical hashes on every platform:
    # this is what lets Mac and Windows players share a lockstep match.
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-15 }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - run: cargo test --workspace
      - name: Data reload tests (dev feature)
        if: runner.os == 'Linux'
        run: cargo test -p gc_game --features dev
      - name: Determinism in release mode
        run: cargo test --release -p gc_sim --test determinism
      - name: Golden replays in release mode
        run: cargo run --release -p gc_replay -- verify replays
      - name: Maps are valid and fair
        run: cargo run --release -p gc_mapcheck -- check
      # The Warlord rehearses each plan in copies of the battle, which takes
      # minutes in a debug build, so its tests only run here.
      - name: Warlord in release mode
        if: runner.os == 'Linux'
        run: cargo test --release -p gc_ai --test versus warlord
      # Whole AI-only Conquest games, which take minutes in a debug build.
      - name: Conquest AI games in release mode
        if: runner.os == 'Linux'
        run: cargo test --release -p gc_game ai_only -- --ignored
      # The real-play stress scenarios (docs/40-real-play-checks.md): a
      # gate, a bridge under fire, a retreat through woods and a computer
      # player attacking walls, with the real game data. About two seconds
      # in a release build.
      - name: Stress scenarios in release mode
        if: runner.os == 'Linux'
        run: cargo test --release -p gc_game stress_suite -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && !cancelled()
        with:
          name: stress-report
          path: target/stress/report.txt
          retention-days: 14
      # macOS runner clocks are too noisy to gate tick time on (the same
      # code has timed 1.2 to 2.8 ms p99 there): it only warns. Linux and
      # Windows still gate it, and the instruction counts below (Linux)
      # are the real guard against slowdowns.
      - name: Simulation benchmark and budgets
        run: cargo run --release -p gc_bench -- ${{ runner.os == 'macOS' && '--warn-on-time' || '' }}
      - name: Big-map benchmark and budgets (six-player Conquest, 768 tiles)
        run: cargo run --release -p gc_bench -- --scenario conquest-6p ${{ runner.os == 'macOS' && '--warn-on-time' || '' }}
      # An hour of six-player Conquest on a 768-tile Wilds map, held to the
      # 6 GB budget and the simulation's big-map heap budget.
      - name: Conquest soak
        if: runner.os == 'Linux'
        run: cargo test --release -p gc_game conquest_soak -- --ignored --nocapture
      # Counts instructions under valgrind, which a busy runner cannot skew,
      # and compares them with tools/gc_bench/baseline.json.
      - name: Benchmark instruction counts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y valgrind
          python3 scripts/bench-gate.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && !cancelled()
        with:
          name: bench-instructions
          path: target/bench/instructions.json
          retention-days: 14

  smoke-linux:
    # The real game, started on a software GPU (Mesa's lavapipe) under a
    # virtual screen, drawing a battle; nothing else in CI ever creates a
    # GPU device. See scripts/smoke-run.py for what fails it.
    name: Smoke run (Linux, software GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - name: Virtual screen and software Vulkan
        run: sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
      - run: cargo build --release -p gc_game
      - name: Play a battle for 300 frames
        run: xvfb-run -a -s "-screen 0 1280x720x24" python3 scripts/smoke-run.py target/release/grubcraft
        env:
          WGPU_BACKEND: vulkan

  msrv:
    # `rust-version` in Cargo.toml is a promise that the game still builds
    # on that Rust; this keeps it true. Keep the version here in step with it.
    name: Oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - run: cargo +1.88.0 check --workspace --locked

  mac-app:
    name: macOS universal app
    # macos-14 is retired by GitHub on 2026-11-02 (brownouts refuse its jobs before that).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Grubcraft-macOS
          path: target/Grubcraft-macOS.zip
          retention-days: 14
      # After the upload, as on Windows. The runner's GPU is Apple's
      # paravirtual Metal device, so this catches shaders and pipelines that
      # Metal rejects but Vulkan accepts (they leave the Mac window black).
      - name: Smoke run of the app (Metal)
        run: |
          python3 scripts/smoke-run.py target/Grubcraft.app/Contents/MacOS/grubcraft 60 menu
          python3 scripts/smoke-run.py target/Grubcraft.app/Contents/MacOS/grubcraft 120

  windows-exe:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
      - run: ./scripts/bundle-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Grubcraft-Windows
          path: target/Grubcraft-Windows.zip
          retention-days: 14
      # After the upload, so a failing smoke run still leaves the zip to download.
      # The zip as friends get it, on Windows' software adapter (WARP). WARP
      # draws a frame of today's battle in about three seconds, so it draws
      # 120 frames, not 300, to stay inside the 15-minute limit.
      - name: Smoke run of the zip
        shell: pwsh
        run: |
          Expand-Archive target/Grubcraft-Windows.zip -DestinationPath target/smoke
          python scripts/smoke-run.py target/smoke/Grubcraft/grubcraft.exe 120
